name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # 快速门禁：只有「错误」才失败（lint / warning 不阻断），比三平台编译早十分钟拿到语法错。
  analyze:
    name: static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze（仅错误阻断）
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # K-01 回归：Windows 通知区域只认 ICO（Shell_NotifyIcon + LoadImage），
      # PNG 会得到 NULL HICON，表现为托盘空白。四态图标缺一即阻断。
      - name: 托盘四态图标必须为 .ico
        run: |
          set -e
          for s in idle transferring error paused; do
            f="assets/tray/tray_${s}.ico"
            [ -f "$f" ] || { echo "FAIL: 缺少 $f"; exit 1; }
            head -c 4 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '00000100' || { echo "FAIL: $f 不是合法 ICO"; exit 1; }
          done
          echo "OK: 托盘四态 ICO 就绪"

      - name: 版本号一致性（pubspec ↔ lib/core/app_info.dart）
        run: |
          set -e
          pubver=$(sed -n 's/^version: *\([0-9][0-9.]*\)+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          pubbuild=$(sed -n 's/^version: *[0-9][0-9.]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          libver=$(sed -n "s/.*static const version = '\([0-9][0-9.]*\)';.*/\1/p" lib/core/app_info.dart)
          libbuild=$(sed -n "s/.*static const build = \([0-9][0-9]*\);.*/\1/p" lib/core/app_info.dart)
          echo "pubspec=$pubver+$pubbuild app_info=$libver+$libbuild"
          [ "$pubver" = "$libver" ] || { echo "FAIL: 版本号不一致"; exit 1; }
          [ "$pubbuild" = "$libbuild" ] || { echo "FAIL: build 号不一致"; exit 1; }

  android-arm64:
    name: Android arm64 APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK 并接受 licenses；缺的平台/NDK 由 Gradle 自动下载。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: 下载内嵌引擎（Android arm64 lite）
        run: bash tool/fetch_openlist.sh android

      - name: flutter analyze（提示性）
        continue-on-error: true
        run: flutter analyze

      - name: 构建 APK
        run: bash tool/ci_build_android.sh

      - name: 校验 APK 内含引擎
        run: |
          set -e
          apk=$(ls dist/*.apk | head -1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libopenlist.so" || { echo "FAIL: APK 内缺少 libopenlist.so"; exit 1; }
          echo "OK: APK 含 lib/arm64-v8a/libopenlist.so"
          if command -v llvm-readelf >/dev/null 2>&1; then
            echo "== 程序头对齐（16KB 页要求 Align >= 0x4000）=="
            unzip -p "$apk" lib/arm64-v8a/libopenlist.so > /tmp/libopenlist.so
            llvm-readelf -l /tmp/libopenlist.so | awk '/LOAD/ {print "  " $0}'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: false

  windows-x64-portable:
    name: Windows x64 portable
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 下载内嵌引擎（OpenList lite）
        shell: bash
        run: bash tool/fetch_openlist.sh windows

      - name: 引擎冒烟（启动 + 健康检查 + 登录 + 驱动数）
        shell: pwsh
        run: ./tool/smoke_sidecar.ps1

      - name: 构建便携版 zip
        shell: pwsh
        run: ./tool/ci_build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false
