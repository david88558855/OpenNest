plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.opennest.app"
    compileSdk = 36
    // path_provider_android / shared_preferences_android 通过 jni 依赖此 NDK 版本
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.opennest.app"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resConfigs "zh", "en"
        // 内嵌引擎以 arm64 原生库形式随包分发，其它 ABI 一并裁掉。
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // 引擎二进制放进 jniLibs 后由系统解压到 nativeLibraryDir（可执行目录）。
    // useLegacyPackaging 必须为 true：否则 AGP 不压缩也不解压，.so 留在 APK 内，
    // nativeLibraryDir 里没有实体文件，Process.start 直接失败。
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add("**/libopenlist.so")
        }
    }

    buildTypes {
        release {
            // CI 产物使用 debug 签名，便于直接安装验收；正式发布请替换为自己的 keystore。
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
