<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>F1 · 页面流转图 — OpenNest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
background:radial-gradient(1200px 600px at 20% 0%,#F2F9FF 0%,#EDF2F8 55%);min-height:100vh;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 24px;color:#0D1B2A}
.wrap{width:1280px;background:#fff;border:1px solid #E3EBF3;border-radius:16px;
box-shadow:0 24px 70px rgba(14,58,70,.14);overflow:hidden}
.titlebar{height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #E3EBF3}
.dot{width:11px;height:11px;border-radius:50%}
.dots{display:flex;gap:7px;margin-right:8px}
.tb-title{font-size:12.5px;color:#6B7F94}
.pill{font-size:11px;font-weight:700;color:#08799F;background:#EAF8FE;border-radius:99px;padding:4px 10px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.head{padding:22px 28px 6px;display:flex;align-items:flex-end;gap:18px}
.h1{font-size:19px;font-weight:800}
.sub{font-size:11.5px;color:#6B7F94;margin-top:4px}
.legend-box{margin-left:auto;display:flex;gap:16px;font-size:11px;color:#42566B}
.legend-box span{display:flex;align-items:center;gap:6px}
.ln{width:26px;height:0;border-top:2px solid #0EA5E9}
.ln.d{border-top-style:dashed}
svg{display:block}
.node{cursor:pointer}
.node:hover rect{stroke:#0EA5E9}
a{text-decoration:none}
</style>
</head>
<body>

<div class="wrap">
  <div class="titlebar">
    <div class="dots"><span class="dot" style="background:#F87C6E"></span><span class="dot" style="background:#F9C25B"></span><span class="dot" style="background:#5FD08A"></span></div>

    <div class="tb-right"><span class="pill">免账户 · 直连存储</span></div>

    <div class="legend-box">
      <span><span class="ln"></span>主流程</span>

    </a>

    <!-- N5 preview -->
    <a href="desktop_06_preview.html" class="node">
      <rect x="968" y="464" width="200" height="76" rx="16" fill="#fff" stroke="#BDE7FA" stroke-width="1.5"/>
      <rect x="968" y="464" width="200" height="22" rx="11" fill="#EAF8FE"/>
      <text x="982" y="479" font-size="10" font-weight="800" fill="#08799F">D6 / D7</text>
      <text x="1068" y="502" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0D1B2A">预览 / 播放</text>
      <text x="1068" y="520" text-anchor="middle" font-size="10" fill="#6B7F94">图片文本 快速预览 · 视频 Range 流式</text>
      <text x="1068" y="534" text-anchor="middle" font-size="9.5" fill="#9DB2C4">同目录播放列表 · 续播记忆</text>
    </a>

    <!-- N6 settings -->
    <a href="desktop_08_settings.html" class="node">
      <rect x="690" y="586" width="204" height="76" rx="16" fill="#fff" stroke="#BDE7FA" stroke-width="1.5"/>
      <rect x="690" y="586" width="204" height="22" rx="11" fill="#EAF8FE"/>
      <text x="704" y="601" font-size="10" font-weight="800" fill="#08799F">D8</text>
