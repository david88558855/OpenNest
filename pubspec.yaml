name: opennest
description: OpenNest —— 免账户直连存储客户端（内嵌 OpenList 引擎）。
publish_to: none
version: 0.5.7+13

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_svg: ^2.0.10
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  file_picker: ^8.0.5
  url_launcher: ^6.3.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.5
  window_manager: ^0.4.2
  tray_manager: ^0.2.3
  desktop_drop: ^0.4.4
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/tray/
    # 品牌母版（与 tool/brand/icon-1024.png 同源）：
    # 顶栏 / 启动页 / 欢迎页的品牌标记直接渲染它，避免界面里再出现
    # 「渐变方块 + layers 线条图标」这套旧 Logo。
    - assets/brand/
